name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck -x -s bash scripts/bootstrap.sh scripts/doctor.sh scripts/smoke-test.sh scripts/lib/common.sh
          shellcheck -s sh docker/entrypoint.sh docker/seed-volume.sh

  compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the pinned image and run the smoke test
        run: ./scripts/smoke-test.sh
