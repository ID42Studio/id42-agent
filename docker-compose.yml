# id42-agent.
# Runtime: HKUDS/nanobot v0.4.2 at 0dc8679edcc6061fbcdf3de13c7e16000e9d1b65.
# There is no official published image. Compose builds the upstream Dockerfile,
# then Dockerfile installs id42-work[mcp,postgres,web] into a separate virtualenv.
# nanobot is MIT licensed. id42-work and this repository's own files are Apache-2.0.
# See NOTICE.

name: id42-agent

x-nanobot: &nanobot
  image: id42-agent-nanobot:0.4.2
  pull_policy: never
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      # Built from the upstream Dockerfile. Keep the git pin in sync with NOTICE.
      upstream: service:nanobot-upstream
    args:
      # Full commit. A branch name is not a pin. Keep in sync with Dockerfile.
      ID42_WORK_REF: ${ID42_WORK_REF:-ae07623aa67c0b5d0535cb58f6a2e2b204736e50}
  environment:
    TZ: ${TZ:-America/Sao_Paulo}
    NANOBOT_DOCKER_BOOTSTRAP: "1"
    NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN:-}
    # Factory storage. sqlite is the default. postgres needs the profile below
    # and ID42_WORK_DATABASE_URL. The URL is a secret; scripts must not print it.
    ID42_WORK_STORAGE: ${ID42_WORK_STORAGE:-sqlite}
    ID42_WORK_DATABASE_URL: ${ID42_WORK_DATABASE_URL:-}
  volumes:
    - nanobot-data:/home/nanobot/.nanobot
    # Notes and the authority key for the default factory, plus the SQLite
    # file when ID42_WORK_STORAGE is sqlite. Outside the agent workspace and
    # outside any home directory. File tools stay inside the workspace; the
    # shell tool is off. Postgres executions live on id42-postgres-data.
    - id42-work-data:/var/lib/id42-work
    - ./docker/entrypoint.sh:/id42/entrypoint.sh:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  entrypoint: ["/bin/sh", "/id42/entrypoint.sh"]
  # Upstream entrypoint starts as root, chowns the data dir, then setpriv
  # drops to uid 1000. Those three capabilities are the ones that entrypoint
  # uses (upstream docker-compose.yml cap_add). Nothing else is added.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  labels:
    - org.opencontainers.image.title=id42-agent
    - org.opencontainers.image.description=Personal nanobot gateway pinned to HKUDS/nanobot v0.4.2, with id42-work
    - org.opencontainers.image.revision=0dc8679edcc6061fbcdf3de13c7e16000e9d1b65
    - org.opencontainers.image.source=https://github.com/HKUDS/nanobot
    - org.opencontainers.image.licenses=MIT AND Apache-2.0

services:
  # Build-only base image. It stays in the default project because a newer
  # Compose rejects additional_contexts that point at a profiled service
  # (`unknown service`) during `docker compose config`. The process exits
  # immediately. `make up` starts only nanobot-gateway.
  nanobot-upstream:
    image: id42-agent-nanobot-upstream:0.4.2
    pull_policy: never
    build:
      context: https://github.com/HKUDS/nanobot.git#0dc8679edcc6061fbcdf3de13c7e16000e9d1b65
      dockerfile: Dockerfile
      args:
        # Upstream default is whatsapp (Dockerfile ARG NANOBOT_CHANNELS).
        NANOBOT_CHANNELS: telegram
    entrypoint: ["true"]
    restart: "no"

  nanobot-gateway:
    <<: *nanobot
    # Optional. With the postgres profile active, wait until Postgres accepts
    # connections. Without that profile the dependency is skipped.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:18790:18790"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18790/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *nanobot
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    restart: "no"

  # Opt-in local Ollama. The default is an existing server on the host.
  # Enable with: docker compose --profile ollama up -d
  # Then set OLLAMA_BASE_URL=http://ollama:11434/v1 before the first init.
  ollama:
    profiles:
      - ollama
    image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G

  # Opt-in Postgres for the default id42-work factory.
  # Enable with: docker compose --profile postgres up -d
  # Set ID42_WORK_STORAGE=postgres and ID42_WORK_DATABASE_URL before the first
  # init when the MCP server is enabled. Credentials come from the env file.
  # This service publishes no host port. The authority key stays on
  # id42-work-data, not in this database.
  postgres:
    profiles:
      - postgres
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ID42_POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${ID42_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${ID42_POSTGRES_DB:-}
    volumes:
      - id42-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Opt-in operator UI for approvals and reconciliation. Same image, same
  # factory, same id42-work-data volume and authority key as the gateway.
  # id42-work binds 127.0.0.1. The entrypoint forwards the published port to
  # that listener. The host map stays on loopback.
  # Enable with: docker compose --profile id42-work-web up -d id42-work-web
  id42-work-web:
    <<: *nanobot
    profiles:
      - id42-work-web
    entrypoint: ["/bin/sh", "/id42/web-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # Replaces the gateway environment. The operator token stays on this
    # service. The gateway process does not receive it.
    environment:
      ID42_WORK_STORAGE: ${ID42_WORK_STORAGE:-sqlite}
      ID42_WORK_DATABASE_URL: ${ID42_WORK_DATABASE_URL:-}
      ID42_WORK_AUTHORITY_KEY_PATH: ${ID42_WORK_AUTHORITY_KEY_PATH:-}
      ID42_WORK_WEB_TOKEN: ${ID42_WORK_WEB_TOKEN:-}
      ID42_WORK_WEB_TOKEN_FILE: ${ID42_WORK_WEB_TOKEN_FILE:-}
    volumes:
      - id42-work-data:/var/lib/id42-work
      - ./docker/web-entrypoint.sh:/id42/web-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${ID42_WORK_WEB_PUBLISH_PORT:-8767}:8767"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8767/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  nanobot-data:
  id42-work-data:
  id42-postgres-data:
  ollama-data:
